[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "robot-physics-fidelity"
version = "2.1.0"
description = "Bounded robotic asset physics validation, diagnosis and reversible repair"
requires-python = ">=3.11,<3.12"
dependencies = ["mujoco==3.17.0", "mujoco-warp==3.17.0", "newton==1.8.0", "mujoco-usd-converter==0.9.0", "newton-usd-schemas==0.7.0", "usd-exchange==3.0.1", "warp-lang==1.19.0", "numpy==2.4.6"]

[project.scripts]
rpf = "robot_physics_fidelity.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
robot_physics_fidelity = ["assets-lock.json", "auto-go2-lock.json"]
